<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glaciers · Tilt through time</title>
<meta name="description" content="Tilt through eleven years of Aletsch and Rhône glaciers, 2016–2026. Exact-date Sentinel-2 Level-1C imagery from Tongues from Space and CDSE.">
<style>

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#171b18;color:#fff;font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;font-weight:400}
#frame{position:fixed;inset:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overflow:hidden;border:1px solid #ffffff18;border-radius:16px;background:#101510}
main{position:absolute;inset:0;touch-action:none;cursor:ns-resize;outline:none}
#image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;transform-origin:center;will-change:transform}
button{font:inherit;font-weight:400;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:1px solid #ffffffb3;outline-offset:3px}
#start,#retry{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;padding:14px 24px;border:1px solid #ffffff24;border-radius:999px;background:#14201985;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px;letter-spacing:.01em}
#start{display:inline-flex;align-items:center;justify-content:center}
#start .tilt-arrow{position:absolute;left:50%;width:18px;height:30px;filter:drop-shadow(0 1px 4px #0008);pointer-events:none}
#start .tilt-arrow:first-child{top:-38px;transform:translateX(-50%)}
#start .tilt-arrow:last-child{bottom:-38px;transform:translateX(-50%) rotate(180deg)}
#year{position:absolute;top:17px;right:18px;pointer-events:none;font-size:25px;line-height:1;font-weight:400;letter-spacing:-.025em;font-variant-numeric:tabular-nums;text-shadow:0 1px 7px #0008,0 0 2px #0008;opacity:0;transition:opacity .8s}
#reset,#switcher{position:absolute;right:10px;bottom:10px;width:44px;height:44px;padding:0;border:1px solid #ffffff13;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:4px;background:#14201912;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:.58;transition:opacity .8s}
#reset{right:60px}#reset svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#switcher span{width:2.5px;height:2.5px;border-radius:50%;background:#fffffff0;box-shadow:0 1px 3px #0005}
#reset.is-quiet,#switcher.is-quiet{opacity:0;pointer-events:none}
#reset:focus-visible,#switcher:focus-visible{opacity:1;pointer-events:auto}
#picker{position:fixed;inset:auto 20px 70px auto;margin:0;width:170px;padding:6px 14px;border:0;border-radius:10px;background:#14201973;color:#fff;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 3px 16px #0001}
#picker::backdrop{background:transparent}
#picker button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:49px;padding:0 6px;border:0;border-radius:0;background:none;text-align:left;opacity:.62}
#picker button[aria-pressed=true],#picker button:hover{opacity:1}
.glacier-name{font-size:16px;letter-spacing:.015em}
#picker button::after{content:'';width:3px;height:3px;flex:none;border-radius:50%;background:transparent}
#picker button[aria-pressed=true]::after{background:#ffffffb3}
#picker button:focus-visible{outline:1px solid #ffffff80;outline-offset:0;border-radius:3px}
#notice{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);padding:10px 15px;border:0;border-radius:8px;background:#14201985;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;font-size:11px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .8s}
#notice.tilt-guide{width:266px;padding:12px 15px;text-align:left}
.guide-row{display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.5}
.guide-row+.guide-row{margin-top:8px}
.guide-row svg{width:10px;height:18px;flex:none;opacity:.85}
.guide-row:last-child svg{transform:rotate(180deg)}
.guide-row small{margin-left:auto;font-size:10px;opacity:.6}
#credit{position:absolute;left:5px;bottom:12px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;opacity:.7;text-shadow:0 1px 5px #000;pointer-events:none}
#map-key{position:absolute;left:18px;bottom:16px;display:flex;align-items:flex-end;gap:13px;color:#fff;opacity:.83;pointer-events:none;filter:drop-shadow(0 1px 3px #0008)}
.north-key{width:12px;display:flex;align-items:center;flex-direction:column;gap:4px}
.north-key span{font-size:8px;letter-spacing:.03em;line-height:1}
.north-key svg{width:10px;height:24px}
.distance-key{display:flex;align-items:center;flex-direction:column;gap:5px;padding-bottom:1px}
#scale-label{font-size:9px;line-height:1;letter-spacing:.035em}
#scale-bar{height:5px;width:60px;border:solid #fff;border-width:0 1px 1px;display:block}
[hidden]{display:none!important}
@media(min-aspect-ratio:3/4){#frame{width:calc((100dvh - max(8px,env(safe-area-inset-top)) - max(8px,env(safe-area-inset-bottom))) * 9 / 16);max-width:calc(100vw - 16px);left:50%;right:auto;transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#switcher,#year,#notice{transition:none}}
</style>
</head>
<body>
<div id="frame"><main id="viewer" tabindex="0" role="slider" aria-label="Glacier year. Tilt top to bottom or swipe vertically." aria-orientation="vertical" aria-valuemin="2016" aria-valuemax="2026" aria-valuenow="2021"><img id="image" alt="" draggable="false" fetchpriority="high" hidden></main>
<button id="start" aria-label="Tap to tilt" hidden><svg class="tilt-arrow" viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg>Tap to tilt<svg class="tilt-arrow" viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg></button><button id="retry" hidden>Try again</button><div id="notice" role="status">Loading glacier · 2021</div><div id="year" aria-hidden="true">2021</div><div id="credit">Modified Copernicus Sentinel data · CDSE · Tongues from Space</div>
<button id="reset" class="is-quiet" aria-label="Recenter tilt" title="Recenter tilt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
<button id="switcher" class="is-quiet" aria-label="Choose glacier" aria-haspopup="dialog" aria-controls="picker" aria-expanded="false"><span></span><span></span><span></span></button>
<div id="map-key" hidden role="img" aria-label="North is up. Scale bar"><div class="north-key" aria-hidden="true"><span>N</span><svg viewBox="0 0 10 24" fill="none"><path d="M5 24V4" stroke="currentColor" stroke-width=".8"/><path d="M5 0L9 9 5 7 1 9Z" fill="currentColor"/></svg></div><div class="distance-key" aria-hidden="true"><span id="scale-label"></span><span id="scale-bar"></span></div></div>
<dialog id="picker" aria-label="Choose glacier"><button data-glacier="aletsch" aria-label="Aletsch" aria-pressed="true"><span class="glacier-name">Aletsch</span></button><button data-glacier="rhone" aria-label="Rhône" aria-pressed="false"><span class="glacier-name">Rhône</span></button></dialog></div>
<script>
'use strict';
const glaciers={
 aletsch:{id:'aletsch',name:'Aletsch',metresPerPixel:4.948639684,prefix:'',bakedCredit:false,dates:['2016-08-23','2017-10-17','2018-09-27','2019-09-12','2020-08-27','2021-10-16','2022-10-06','2023-09-26','2024-08-31','2025-09-20','2026-09-12']},
 rhone:{id:'rhone',name:'Rhône',metresPerPixel:3.886217949,prefix:'rhone-',bakedCredit:true,dates:['2016-09-29','2017-08-25','2018-10-04','2019-09-29','2020-09-13','2021-09-23','2022-08-09','2023-09-28','2024-08-23','2025-08-18','2026-09-27']}
};
for(const entry of Object.values(glaciers)){entry.frames=[];entry.pending=new Map()}
const image=document.querySelector('#image'),viewer=document.querySelector('#viewer'),notice=document.querySelector('#notice'),year=document.querySelector('#year'),start=document.querySelector('#start'),retry=document.querySelector('#retry'),credit=document.querySelector('#credit'),reset=document.querySelector('#reset'),switcher=document.querySelector('#switcher'),picker=document.querySelector('#picker'),mapKey=document.querySelector('#map-key'),scaleBar=document.querySelector('#scale-bar'),scaleLabel=document.querySelector('#scale-label');
const pointers=new Map();
let zoom=1,panX=0,panY=0,pinch=null;
let glacier=null,selected=5,ready=false,welcomed=false,active=false,latestPitch=null,baseline=null,center=5,filtered=0,drag=null,toastTimer,yearTimer;
function toast(text,ms=3500){clearTimeout(toastTimer);notice.classList.remove('tilt-guide');notice.textContent=text;notice.style.opacity=text?'1':'0';if(ms)toastTimer=setTimeout(()=>notice.style.opacity='0',ms)}
function showTiltGuide(){clearTimeout(toastTimer);notice.classList.add('tilt-guide');notice.innerHTML='<span class="guide-row"><svg viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg><span>Top edge away</span><small>Later years</small></span><span class="guide-row"><svg viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg><span>Towards you</span><small>Earlier years</small></span>';notice.style.opacity='1';toastTimer=setTimeout(()=>notice.style.opacity='0',6000)}
function revealHud(ms=1600){clearTimeout(yearTimer);year.style.opacity='1';switcher.classList.remove('is-quiet');reset.classList.remove('is-quiet');if(picker.open)return;yearTimer=setTimeout(()=>{year.style.opacity='0';switcher.classList.add('is-quiet');reset.classList.add('is-quiet')},ms)}
function updateMapKey(){if(!glacier||!image.naturalWidth||image.hidden){mapKey.hidden=true;return}const r=image.getBoundingClientRect(),enlargement=Math.max(r.width/image.naturalWidth,r.height/image.naturalHeight),metresPerCssPixel=glacier.metresPerPixel/enlargement,target=metresPerCssPixel*76;const values=[20,50,100,200,500,1000,2000,5000];let distance=values[0];for(const value of values)if(value<=target)distance=value;const label=distance>=1000?(distance/1000)+' km':distance+' m';scaleLabel.textContent=label;scaleBar.style.width=(distance/metresPerCssPixel)+'px';mapKey.setAttribute('aria-label','North is up. Scale bar '+label);mapKey.hidden=false}
function applyZoom(){const r=viewer.getBoundingClientRect(),maxX=r.width*(zoom-1)/2,maxY=r.height*(zoom-1)/2;panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY));image.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';updateMapKey()}
function resetZoom(){zoom=1;panX=panY=0;applyZoom()}
function pinchStart(){const [a,b]=[...pointers.values()],r=viewer.getBoundingClientRect();pinch={distance:Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),zoom,panX,panY,midX:(a.x+b.x)/2,midY:(a.y+b.y)/2,centerX:r.left+r.width/2,centerY:r.top+r.height/2};drag=null;recenter()}
function pinchMove(){const [a,b]=[...pointers.values()];if(!a||!b||!pinch)return;zoom=Math.max(1,Math.min(4,pinch.zoom*Math.hypot(b.x-a.x,b.y-a.y)/pinch.distance));const ratio=zoom/pinch.zoom;panX=(a.x+b.x)/2-pinch.centerX-(pinch.midX-pinch.centerX-pinch.panX)*ratio;panY=(a.y+b.y)/2-pinch.centerY-(pinch.midY-pinch.centerY-pinch.panY)*ratio;applyZoom()}
function recenter(){baseline=null;center=selected;filtered=0}
function render(entry,i,announce){if(entry!==glacier)return;image.src=entry.frames[i].src;image.alt=entry.name+' glacier, '+entry.dates[i];image.hidden=false;ready=true;viewer.setAttribute('aria-valuenow',2016+i);viewer.setAttribute('aria-valuetext',entry.name+', '+entry.dates[i]);year.textContent=2016+i;retry.hidden=true;toast('');updateMapKey();revealHud(announce?1600:3200)}
function load(entry,i){if(entry.frames[i])return Promise.resolve(entry.frames[i]);if(entry.pending.has(i))return entry.pending.get(i);const p=(async()=>{const img=new Image();img.src=entry.prefix+(2016+i)+'.webp';await img.decode();entry.frames[i]=img;return img})();entry.pending.set(i,p);p.finally(()=>entry.pending.delete(i)).catch(()=>{});return p}
async function show(i,announce=true){selected=Math.max(0,Math.min(10,i));const wanted=selected,entry=glacier;if(entry.frames[wanted]){render(entry,wanted,announce);return}toast('Loading '+(2016+wanted)+'…',0);try{await load(entry,wanted);if(glacier===entry&&selected===wanted)render(entry,wanted,announce)}catch{if(glacier===entry&&selected===wanted){toast('Could not load '+(2016+wanted)+'. Tap Try again.',0);retry.hidden=false}}}
function welcome(){if(welcomed)return;welcomed=true;if('ontouchstart' in window||navigator.maxTouchPoints>0){start.hidden=false;toast('2016 — 2026',0)}else toast('Swipe up / down · or use arrow keys',4500)}
async function openGlacier(){const id=location.hash.slice(1).toLowerCase(),entry=glaciers[id]||glaciers.aletsch;if(entry===glacier&&ready)return;if(glacier)glacier.frames=[];glacier=entry;ready=false;selected=5;drag=null;pinch=null;pointers.clear();recenter();resetZoom();image.hidden=true;mapKey.hidden=true;retry.hidden=true;clearTimeout(yearTimer);year.style.opacity='0';switcher.classList.add('is-quiet');reset.classList.add('is-quiet');credit.hidden=entry.bakedCredit;document.title=entry.name+' · Tilt through time';viewer.setAttribute('aria-label',entry.name+' glacier year. Tilt top to bottom or swipe vertically.');viewer.setAttribute('aria-valuenow','2021');for(const button of picker.querySelectorAll('[data-glacier]'))button.setAttribute('aria-pressed',String(button.dataset.glacier===entry.id));toast('Loading '+entry.name+' · 2021',0);try{await load(entry,5);if(glacier!==entry)return;render(entry,5,false);recenter();welcome();const queue=[4,6,3,7,2,8,1,9,0,10];await Promise.all([0,1].map(async()=>{while(queue.length&&glacier===entry){const i=queue.shift();try{await load(entry,i)}catch{console.warn('Frame not preloaded:',entry.id,2016+i)}}}))}catch{if(glacier===entry){toast('Could not load imagery. Tap Try again.',0);retry.hidden=false}}}
// Screen-relative pitch: top edge away advances the years.
function pitch(e){const a=screen.orientation?.angle??window.orientation??0;if(a===90)return e.gamma;if(a===270||a===-90)return e.gamma===null?null:-e.gamma;if(a===180)return e.beta;return e.beta===null?null:-e.beta}
function orient(e){const raw=pitch(e);if(!Number.isFinite(raw))return;latestPitch=raw;if(!active||!ready||pointers.size||picker.open)return;if(baseline===null){baseline=raw;center=selected;return}const delta=((raw-baseline+180)%360+360)%360-180;filtered+=.2*(delta-filtered);const position=center+filtered/2.4,target=Math.max(0,Math.min(10,Math.round(position)));if(target!==selected&&Math.abs(position-selected)>.65)show(target)}
window.addEventListener('deviceorientation',orient,{passive:true});
async function begin(){let permission=true;try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')permission=(await DeviceOrientationEvent.requestPermission())==='granted'}catch{permission=false}active=permission;recenter();start.hidden=true;revealHud(4000);permission?showTiltGuide():toast('Motion is off · swipe up for later years',5000);if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}
start.addEventListener('click',begin);
viewer.addEventListener('pointerdown',e=>{if(!ready||picker.open||pointers.size>=2)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});viewer.setPointerCapture(e.pointerId);if(pointers.size===2)pinchStart();else drag={x:e.clientX,y:e.clientY,index:selected,moved:false}});
viewer.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pointers.size===2){pinchMove();return}if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;const target=Math.round(drag.index+(drag.y-e.clientY)/(innerHeight*.065));if(target!==selected)show(target)});
function endGesture(e){if(!pointers.has(e.pointerId))return;const tapped=pointers.size===1&&!pinch&&drag&&!drag.moved&&e.type==='pointerup';pointers.delete(e.pointerId);pinch=null;drag=null;if(!pointers.size)recenter();if(tapped)revealHud(2800)}
viewer.addEventListener('pointerup',endGesture);viewer.addEventListener('pointercancel',endGesture);viewer.addEventListener('lostpointercapture',endGesture);
viewer.addEventListener('keydown',e=>{if(!ready||picker.open)return;const keys=['ArrowUp','ArrowDown','ArrowRight','ArrowLeft','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();show(e.key==='Home'?0:e.key==='End'?10:selected+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1));recenter()});
viewer.addEventListener('dblclick',()=>{if(!ready)return;resetZoom();show(5);recenter();toast('Centered on 2021',2000)});
function positionPicker(){const r=switcher.getBoundingClientRect();picker.style.right=(innerWidth-r.right)+'px';picker.style.bottom=(innerHeight-r.top+10)+'px'}
window.addEventListener('resize',()=>{applyZoom();if(picker.open)positionPicker()});
reset.addEventListener('focus',()=>revealHud(2400));
reset.addEventListener('click',()=>{baseline=latestPitch;center=5;filtered=0;show(5);revealHud(2800)});
image.addEventListener('load',updateMapKey);switcher.addEventListener('focus',()=>revealHud(2400));
switcher.addEventListener('click',()=>{drag=null;picker.showModal();revealHud();positionPicker();switcher.setAttribute('aria-expanded','true');picker.querySelector('[aria-pressed="true"]').focus()});
picker.addEventListener('click',e=>{const button=e.target.closest('[data-glacier]');if(button){picker.close();if(button.dataset.glacier!==glacier?.id)location.hash=button.dataset.glacier;return}const r=picker.getBoundingClientRect();if(e.target===picker&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))picker.close()});
picker.addEventListener('close',()=>{switcher.setAttribute('aria-expanded','false');recenter();switcher.focus();revealHud(2400)});
screen.orientation?.addEventListener('change',recenter);document.addEventListener('visibilitychange',()=>{if(!document.hidden)recenter()});window.addEventListener('hashchange',openGlacier);
retry.addEventListener('click',()=>{retry.hidden=true;if(ready)show(selected);else openGlacier()});
openGlacier();
</script>
</body>
</html>
