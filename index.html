<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glaciers · Tilt through time</title>
<meta name="description" content="Tilt through eleven years of Aletsch and Rhône glaciers, 2016–2026. Exact-date Sentinel-2 Level-1C imagery from Tongues from Space and CDSE.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101510;color:white;font-family:system-ui,sans-serif;overscroll-behavior:none}main{position:fixed;inset:0;touch-action:none;cursor:ns-resize;outline:none}#image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}button{font:inherit;color:inherit;border:1px solid #ffffff50;background:#142019b8;backdrop-filter:blur(16px);border-radius:999px;padding:14px 22px;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:4px}#start,#retry{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}#notice{position:fixed;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 64px);padding:10px 16px;border:1px solid #ffffff20;border-radius:22px;background:#142019b8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 24px #0002;text-align:center;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .7s}#start{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;letter-spacing:.01em;box-shadow:0 4px 24px #0002}#start .tilt-arrow{position:absolute;top:50%;width:18px;height:30px;transform:translateY(-50%);color:white;filter:drop-shadow(0 1px 4px #0008);pointer-events:none}#start .tilt-arrow:first-child{left:-34px}#start .tilt-arrow:last-child{right:-34px;transform:translateY(-50%) rotate(180deg)}#notice.tilt-guide{width:272px;padding:12px 16px;border-radius:20px;text-align:left}.guide-title{display:block;margin-bottom:9px;font-size:9px;letter-spacing:.16em;opacity:.6}.guide-row{display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.6}.guide-row+.guide-row{margin-top:5px}.guide-row svg{width:10px;height:18px;flex:none;opacity:.85}.guide-row:last-child svg{transform:rotate(180deg)}.guide-row small{margin-left:auto;font-size:11px;opacity:.6}#year{position:fixed;top:max(22px,env(safe-area-inset-top));right:24px;font-size:15px;letter-spacing:.12em;text-shadow:0 1px 8px black;opacity:0;transition:opacity .7s;pointer-events:none}#credit{position:fixed;left:7px;bottom:12px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;opacity:.75;text-shadow:0 1px 5px black;pointer-events:none}#switcher{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:44px;height:44px;padding:0;border:0;display:flex;align-items:center;justify-content:center;gap:4px;background:#10151030;backdrop-filter:blur(8px);box-shadow:0 1px 10px #0002}#switcher span{width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0006}#picker{position:fixed;inset:auto max(14px,env(safe-area-inset-right)) calc(max(12px,env(safe-area-inset-bottom)) + 54px) auto;margin:0;width:190px;padding:6px;border:1px solid #ffffff25;border-radius:20px;color:white;background:#152019ed;backdrop-filter:blur(24px);box-shadow:0 10px 40px #0005}#picker::backdrop{background:transparent}#picker button{display:flex;align-items:center;justify-content:space-between;width:100%;height:52px;padding:0 16px;text-align:left;font-size:15px;border:0;border-radius:14px;background:none;backdrop-filter:none}#picker button[aria-pressed=true]{background:#ffffff12}#picker button:hover{background:#ffffff18}#picker button::after{content:'';width:6px;height:6px;border-radius:50%;background:transparent}#picker button[aria-pressed=true]::after{background:#b7d3c4}[hidden]{display:none!important}@media(orientation:landscape){#image{object-fit:contain}}@media(prefers-reduced-motion:reduce){#year,#notice{transition:none}}
</style>
</head>
<body>
<main id="viewer" tabindex="0" role="slider" aria-label="Glacier year. Tilt top to bottom or swipe vertically." aria-orientation="vertical" aria-valuemin="2016" aria-valuemax="2026" aria-valuenow="2021"><img id="image" alt="" draggable="false" fetchpriority="high" hidden></main>
<button id="start" aria-label="Tap to tilt" hidden><svg class="tilt-arrow" viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg>Tap to tilt<svg class="tilt-arrow" viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg></button><button id="retry" hidden>Try again</button><div id="notice" role="status">Loading glacier · 2021</div><div id="year" aria-hidden="true">2021</div><div id="credit">Modified Copernicus Sentinel data · CDSE · Tongues from Space</div>
<button id="switcher" aria-label="Choose glacier" aria-haspopup="dialog" aria-controls="picker" aria-expanded="false"><span></span><span></span><span></span></button>
<dialog id="picker" aria-label="Choose glacier"><button data-glacier="aletsch" aria-pressed="true">Aletsch</button><button data-glacier="rhone" aria-pressed="false">Rhône</button></dialog>
<script>
'use strict';
const glaciers={
 aletsch:{id:'aletsch',name:'Aletsch',prefix:'',bakedCredit:false,dates:['2016-08-23','2017-10-17','2018-09-27','2019-09-12','2020-08-27','2021-10-16','2022-10-06','2023-09-26','2024-08-31','2025-09-20','2026-09-12']},
 rhone:{id:'rhone',name:'Rhône',prefix:'rhone-',bakedCredit:true,dates:['2016-09-29','2017-08-25','2018-10-04','2019-09-29','2020-09-13','2021-09-23','2022-08-09','2023-09-28','2024-08-23','2025-08-18','2026-09-27']}
};
for(const entry of Object.values(glaciers)){entry.frames=[];entry.pending=new Map()}
const image=document.querySelector('#image'),viewer=document.querySelector('#viewer'),notice=document.querySelector('#notice'),year=document.querySelector('#year'),start=document.querySelector('#start'),retry=document.querySelector('#retry'),credit=document.querySelector('#credit'),switcher=document.querySelector('#switcher'),picker=document.querySelector('#picker');
let glacier=null,selected=5,ready=false,welcomed=false,active=false,baseline=null,center=5,filtered=0,drag=null,toastTimer,yearTimer;
function toast(text,ms=3500){clearTimeout(toastTimer);notice.classList.remove('tilt-guide');notice.textContent=text;notice.style.opacity=text?'1':'0';if(ms)toastTimer=setTimeout(()=>notice.style.opacity='0',ms)}
function showTiltGuide(){clearTimeout(toastTimer);notice.classList.add('tilt-guide');notice.innerHTML='<span class="guide-title">TILT THROUGH TIME</span><span class="guide-row"><svg viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg><span>Top edge away</span><small>Later years</small></span><span class="guide-row"><svg viewBox="0 0 16 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 27V3M3 8l5-5 5 5"/></svg><span>Towards you</span><small>Earlier years</small></span>';notice.style.opacity='1';toastTimer=setTimeout(()=>notice.style.opacity='0',6000)}
function recenter(){baseline=null;center=selected;filtered=0}
function render(entry,i,announce){if(entry!==glacier)return;image.src=entry.frames[i].src;image.alt=entry.name+' glacier, '+entry.dates[i];image.hidden=false;ready=true;viewer.setAttribute('aria-valuenow',2016+i);viewer.setAttribute('aria-valuetext',entry.name+', '+entry.dates[i]);year.textContent=2016+i;retry.hidden=true;toast('');if(announce){clearTimeout(yearTimer);year.style.opacity='1';yearTimer=setTimeout(()=>year.style.opacity='0',1100)}}
function load(entry,i){if(entry.frames[i])return Promise.resolve(entry.frames[i]);if(entry.pending.has(i))return entry.pending.get(i);const p=(async()=>{const img=new Image();img.src=entry.prefix+(2016+i)+'.webp';await img.decode();entry.frames[i]=img;return img})();entry.pending.set(i,p);p.finally(()=>entry.pending.delete(i)).catch(()=>{});return p}
async function show(i,announce=true){selected=Math.max(0,Math.min(10,i));const wanted=selected,entry=glacier;if(entry.frames[wanted]){render(entry,wanted,announce);return}toast('Loading '+(2016+wanted)+'…',0);try{await load(entry,wanted);if(glacier===entry&&selected===wanted)render(entry,wanted,announce)}catch{if(glacier===entry&&selected===wanted){toast('Could not load '+(2016+wanted)+'. Tap Try again.',0);retry.hidden=false}}}
function welcome(){if(welcomed)return;welcomed=true;if('ontouchstart' in window||navigator.maxTouchPoints>0){start.hidden=false;toast('2016 — 2026',0)}else toast('Swipe up / down · or use arrow keys',4500)}
async function openGlacier(){const id=location.hash.slice(1).toLowerCase(),entry=glaciers[id]||glaciers.aletsch;if(entry===glacier&&ready)return;if(glacier)glacier.frames=[];glacier=entry;ready=false;selected=5;drag=null;recenter();image.hidden=true;retry.hidden=true;clearTimeout(yearTimer);year.style.opacity='0';credit.hidden=entry.bakedCredit;document.title=entry.name+' · Tilt through time';viewer.setAttribute('aria-label',entry.name+' glacier year. Tilt top to bottom or swipe vertically.');viewer.setAttribute('aria-valuenow','2021');for(const button of picker.querySelectorAll('[data-glacier]'))button.setAttribute('aria-pressed',String(button.dataset.glacier===entry.id));toast('Loading '+entry.name+' · 2021',0);try{await load(entry,5);if(glacier!==entry)return;render(entry,5,false);recenter();welcome();const queue=[4,6,3,7,2,8,1,9,0,10];await Promise.all([0,1].map(async()=>{while(queue.length&&glacier===entry){const i=queue.shift();try{await load(entry,i)}catch{console.warn('Frame not preloaded:',entry.id,2016+i)}}}))}catch{if(glacier===entry){toast('Could not load imagery. Tap Try again.',0);retry.hidden=false}}}
// Screen-relative pitch: top edge away advances the years.
function pitch(e){const a=screen.orientation?.angle??window.orientation??0;if(a===90)return e.gamma;if(a===270||a===-90)return e.gamma===null?null:-e.gamma;if(a===180)return e.beta;return e.beta===null?null:-e.beta}
function orient(e){if(!active||!ready||drag||picker.open)return;const raw=pitch(e);if(!Number.isFinite(raw))return;if(baseline===null){baseline=raw;center=selected;return}const delta=((raw-baseline+180)%360+360)%360-180;filtered+=.2*(delta-filtered);const position=center+filtered/5,target=Math.max(0,Math.min(10,Math.round(position)));if(target!==selected&&Math.abs(position-selected)>.65)show(target)}
window.addEventListener('deviceorientation',orient,{passive:true});
async function begin(){let permission=true;try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')permission=(await DeviceOrientationEvent.requestPermission())==='granted'}catch{permission=false}active=permission;recenter();start.hidden=true;permission?showTiltGuide():toast('Motion is off · swipe up for later years',5000);if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}
start.addEventListener('click',begin);
viewer.addEventListener('pointerdown',e=>{if(!ready||picker.open)return;drag={y:e.clientY,index:selected};viewer.setPointerCapture(e.pointerId)});
viewer.addEventListener('pointermove',e=>{if(!drag)return;const target=Math.round(drag.index+(drag.y-e.clientY)/(innerHeight*.065));if(target!==selected)show(target)});
function endDrag(){drag=null;recenter()}
viewer.addEventListener('pointerup',endDrag);viewer.addEventListener('pointercancel',endDrag);
viewer.addEventListener('keydown',e=>{if(!ready||picker.open)return;const keys=['ArrowUp','ArrowDown','ArrowRight','ArrowLeft','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();show(e.key==='Home'?0:e.key==='End'?10:selected+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1));recenter()});
viewer.addEventListener('dblclick',()=>{if(!ready)return;show(5);recenter();toast('Centered on 2021',2000)});
switcher.addEventListener('click',()=>{drag=null;picker.showModal();switcher.setAttribute('aria-expanded','true');picker.querySelector('[aria-pressed="true"]').focus()});
picker.addEventListener('click',e=>{const button=e.target.closest('[data-glacier]');if(button){picker.close();if(button.dataset.glacier!==glacier?.id)location.hash=button.dataset.glacier;return}const r=picker.getBoundingClientRect();if(e.target===picker&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))picker.close()});
picker.addEventListener('close',()=>{switcher.setAttribute('aria-expanded','false');recenter();switcher.focus()});
screen.orientation?.addEventListener('change',recenter);document.addEventListener('visibilitychange',()=>{if(!document.hidden)recenter()});window.addEventListener('hashchange',openGlacier);
retry.addEventListener('click',()=>{retry.hidden=true;if(ready)show(selected);else openGlacier()});
openGlacier();
</script>
</body>
</html>
