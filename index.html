<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111612"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Aletsch · Tilt through time</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111612;color:white;font-family:system-ui,sans-serif;overscroll-behavior:none}main{position:fixed;inset:0;display:grid;place-items:center;touch-action:none;cursor:ew-resize}canvas{display:block;width:100%;height:100%;object-fit:contain}button{font:inherit;color:inherit;border:1px solid #ffffff50;background:#142019b8;backdrop-filter:blur(16px);border-radius:999px;padding:14px 22px;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:5px}#start,#retry{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}#notice{position:fixed;bottom:max(26px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;font-size:13px;line-height:1.5;text-shadow:0 1px 8px black;pointer-events:none;transition:opacity 1s}#year{position:fixed;top:max(22px,env(safe-area-inset-top));right:24px;font-size:15px;letter-spacing:.12em;text-shadow:0 1px 8px black;opacity:0;transition:opacity .8s;pointer-events:none}#credit{position:fixed;left:7px;bottom:12px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;opacity:.75;text-shadow:0 1px 5px black;pointer-events:none}[hidden]{display:none!important}</style>
<main id="viewer" tabindex="0" role="slider" aria-label="Aletsch glacier year. Tilt your phone or swipe horizontally." aria-valuemin="2016" aria-valuemax="2026" aria-valuenow="2021"><canvas id="image" width="810" height="1440" role="img" aria-label="Aletsch glacier, 2021"></canvas></main><button id="start" hidden>Tap to enable tilt</button><button id="retry" hidden>Try again</button><div id="notice" role="status">Loading Aletsch · 2021</div><div id="year">2021</div><div id="credit">Modified Copernicus Sentinel data · Earth Search / Element 84</div>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script>
'use strict';
const dates=['2016-08-23','2017-10-17','2018-09-27','2019-09-12','2020-08-27','2021-10-16','2022-10-06','2023-09-26','2024-08-31','2025-09-20','2026-09-12'];
// Identical north-up crop for every acquisition, EPSG:32632.
const bounds=[424900,5138700,428950,5145900];
const canvas=document.querySelector('#image'),ctx=canvas.getContext('2d',{alpha:false}),viewer=document.querySelector('#viewer'),notice=document.querySelector('#notice'),year=document.querySelector('#year'),start=document.querySelector('#start'),retry=document.querySelector('#retry');
const frames=Array(11),pending=new Map(),failures=new Set();
let selected=5,active=false,baseline=null,filtered=0,started=false,toastTimer,yearTimer,drag=null;
function toast(text,ms=3200){clearTimeout(toastTimer);notice.textContent=text;notice.style.opacity='1';if(ms)toastTimer=setTimeout(()=>notice.style.opacity='0',ms)}
function show(index,announce=true){selected=Math.max(0,Math.min(10,index));viewer.setAttribute('aria-valuenow',2016+selected);canvas.setAttribute('aria-label','Aletsch glacier, '+(2016+selected));year.textContent=2016+selected;clearTimeout(yearTimer);if(announce){year.style.opacity='1';yearTimer=setTimeout(()=>year.style.opacity='0',1200)}if(frames[selected])ctx.drawImage(frames[selected],0,0,canvas.width,canvas.height);else{const requested=selected;toast('Loading '+(2016+selected)+'…',0);load(requested).then(()=>{if(selected===requested){ctx.drawImage(frames[requested],0,0,canvas.width,canvas.height);toast('',1)}}).catch(()=>{if(selected===requested)toast((2016+requested)+' unavailable · swipe to another year',6000)})}}
async function json(url){const response=await fetch(url,{signal:AbortSignal.timeout(45000)});if(!response.ok)throw Error('Earth Search '+response.status);return response.json()}
async function load(index){if(frames[index])return frames[index];if(pending.has(index))return pending.get(index);const work=(async()=>{const date=dates[index];const params=new URLSearchParams({collections:'sentinel-2-l2a',bbox:'8.00,46.38,8.10,46.48',datetime:date+'T00:00:00Z/'+date+'T23:59:59Z',limit:'30'});const data=await json('https://earth-search.aws.element84.com/v1/search?'+params);const items=data.features.filter(f=>f.properties['grid:code']==='MGRS-32TMS'&&f.assets.visual?.href?.startsWith('https:')&&(!f.properties['s2:product_uri']||f.properties['s2:product_uri'].includes('_R108_'))).sort((a,b)=>String(b.properties['s2:processing_baseline']).localeCompare(String(a.properties['s2:processing_baseline']))||String(b.properties.created).localeCompare(String(a.properties.created)));if(!items.length)throw Error('No exact-date scene for '+date);const item=items[0],tiff=await GeoTIFF.fromUrl(item.assets.visual.href,{allowFullFile:false});try{const image=await tiff.getImage(),origin=image.getOrigin(),resolution=image.getResolution();const window=[Math.floor((bounds[0]-origin[0])/resolution[0]),Math.floor((bounds[3]-origin[1])/resolution[1]),Math.ceil((bounds[2]-origin[0])/resolution[0]),Math.ceil((bounds[1]-origin[1])/resolution[1])];const width=window[2]-window[0],height=window[3]-window[1],rgb=await image.readRasters({window,interleave:true,samples:[0,1,2]});const off=document.createElement('canvas');off.width=width;off.height=height;const c=off.getContext('2d'),pixels=c.createImageData(width,height);for(let p=0,q=0;p<rgb.length;p+=3,q+=4){pixels.data[q]=rgb[p];pixels.data[q+1]=rgb[p+1];pixels.data[q+2]=rgb[p+2];pixels.data[q+3]=255}c.putImageData(pixels,0,0);frames[index]=off;failures.delete(index);return off}finally{await tiff.close()}})();pending.set(index,work);try{return await work}catch(error){failures.add(index);console.error(dates[index],error);throw error}finally{pending.delete(index)}}
function angle(event){const a=screen.orientation?.angle??window.orientation??0;return a===90?-event.beta:a===270||a===-90?event.beta:a===180?-event.gamma:event.gamma}
function orient(event){if(!active||drag)return;const raw=angle(event);if(!Number.isFinite(raw))return;if(baseline===null){baseline=raw;filtered=0;return}let relative=((raw-baseline+180)%360+360)%360-180;filtered+=.22*(relative-filtered);const continuous=5+filtered/5,target=Math.max(0,Math.min(10,Math.round(continuous)));if(target!==selected&&Math.abs(continuous-selected)>.64)show(target)}
window.addEventListener('deviceorientation',orient,{passive:true});
async function enable(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted'){toast('Motion is off · swipe left or right',6000);return}}active=true;baseline=null;start.hidden=true;toast('Tilt left for 2016 · right for 2026',4000);if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}catch(error){toast('Tilt unavailable · swipe left or right',6000)}}
start.addEventListener('click',enable);viewer.addEventListener('pointerdown',event=>{drag={x:event.clientX,index:selected};viewer.setPointerCapture(event.pointerId)});viewer.addEventListener('pointermove',event=>{if(!drag)return;show(Math.round(drag.index+(event.clientX-drag.x)/(innerWidth*.075)));baseline=null});viewer.addEventListener('pointerup',()=>{drag=null});viewer.addEventListener('pointercancel',()=>{drag=null});viewer.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();show(event.key==='Home'?0:event.key==='End'?10:selected+(event.key==='ArrowRight'?1:-1));baseline=null}});viewer.addEventListener('dblclick',()=>{baseline=null;filtered=0;show(5);toast('Centered on 2021',2000)});screen.orientation?.addEventListener('change',()=>{baseline=null});document.addEventListener('visibilitychange',()=>{if(!document.hidden)baseline=null});
async function init(){retry.hidden=true;toast('Loading Aletsch · 2021',0);try{await load(5);show(5,false);if(!started){started=true;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){start.hidden=false;toast('2016 — 2026 · tap once, then tilt',0)}else{active=true;toast('Tilt left or right · or swipe',5000)}}else toast('Ready · tilt or swipe');const queue=[4,6,3,7,2,8,1,9,0,10];await Promise.all([0,1].map(async()=>{while(queue.length){try{await load(queue.shift())}catch{}}}));if(failures.size)toast('Some years could not load. Reload to retry.',7000)}catch(error){toast('Could not load satellite imagery. Check your connection and try again.',0);retry.hidden=false}}
retry.addEventListener('click',init);init();
</script></html>
