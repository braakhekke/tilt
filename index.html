async function begin(){let permission=true;const requests=[];try{requests.push(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'?DeviceOrientationEvent.requestPermission():Promise.resolve('granted'));requests.push(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'?DeviceMotionEvent.requestPermission():Promise.resolve('granted'));const results=await Promise.allSettled(requests);permission=results[0].status==='fulfilled'&&results[0].value==='granted';motionEnabled=results[1].status==='fulfilled'&&results[1].value==='granted'}catch{permission=false}active=permission;recenter();start.hidden=true;compareToggle.hidden=!ready;revealHud(6000);permission?toast(''):toast('Motion is off · slide to compare or swipe for years',4500);if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}
function shake(e){if(!motionEnabled||!ready||picker.open||document.hidden)return;const now=Date.now();let a=e.acceleration;let magnitude;if(a&&[a.x,a.y,a.z].every(Number.isFinite)){magnitude=Math.hypot(a.x,a.y,a.z)}else{a=e.accelerationIncludingGravity;if(!a||![a.x,a.y,a.z].every(Number.isFinite))return;const previous=lastGravity;lastGravity={x:a.x,y:a.y,z:a.z};if(!previous)return;magnitude=Math.hypot(a.x-previous.x,a.y-previous.y,a.z-previous.z)}if(now-lastShake<2200||pointers.size||compareDrag!==null)return;shakeHits=shakeHits.filter(t=>now-t<700);if(magnitude>14&&(!shakeHits.length||now-shakeHits[shakeHits.length-1]>90))shakeHits.push(now);if(shakeHits.length>=3){lastShake=now;shakeHits=[];location.hash=glacier.id==='aletsch'?'rhone':'aletsch'}}
window.addEventListener('devicemotion',shake,{passive:true});
start.addEventListener('click',begin);
viewer.addEventListener('pointerdown',e=>{if(!ready||picker.open||pointers.size>=2)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});viewer.setPointerCapture(e.pointerId);if(pointers.size===2)pinchStart();else drag={x:e.clientX,y:e.clientY,index:selected,moved:false,axis:null,compareAnchor:comparing?Number(compareRange.value):50,compareX:e.clientX}});
viewer.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pointers.size===2){pinchMove();return}if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;if(!drag.axis){if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;drag.axis=Math.abs(dx)>Math.abs(dy)*1.2?'compare':Math.abs(dy)>Math.abs(dx)*1.2?'years':null;if(!drag.axis)return;if(drag.axis==='compare'&&!comparing){drag.compareX=e.clientX;drag.compareAnchor=50;compareRange.value=50;compare();return}}
if(drag.axis==='compare'){const r=viewer.getBoundingClientRect();compareRange.value=Math.max(0,Math.min(100,drag.compareAnchor+(e.clientX-drag.compareX)/r.width*100));compare();return}const target=Math.round(drag.index+(drag.y-e.clientY)/(innerHeight*.065));if(comparing||target!==selected)show(target)});

function endGesture(e){if(!pointers.has(e.pointerId))return;const tapped=pointers.size===1&&!pinch&&drag&&!drag.moved&&e.type==='pointerup';pointers.delete(e.pointerId);pinch=null;drag=null;if(!pointers.size)recenter();if(tapped)revealHud(2800)}
viewer.addEventListener('pointerup',endGesture);viewer.addEventListener('pointercancel',endGesture);viewer.addEventListener('lostpointercapture',endGesture);
viewer.addEventListener('keydown',e=>{if(!ready||picker.open)return;const keys=['ArrowUp','ArrowDown','ArrowRight','ArrowLeft','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft'||e.key==='ArrowRight'){compareRange.value=comparing?Math.max(0,Math.min(100,Number(compareRange.value)+(e.key==='ArrowRight'?5:-5))):50;compare();recenter();return}show(e.key==='Home'?0:e.key==='End'?10:selected+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1));recenter()});
viewer.addEventListener('dblclick',()=>{if(!ready)return;resetZoom();show(5);recenter();toast('Centered on 2021',2000)});
function positionPicker(){const r=glacierToggle.getBoundingClientRect();picker.style.left=Math.max(16,r.left)+'px';picker.style.top=Math.min(innerHeight-155,r.bottom+12)+'px'}
window.addEventListener('resize',()=>{applyZoom();if(picker.open)positionPicker()});
glacierToggle.addEventListener('focus',()=>revealHud(4000));
glacierToggle.addEventListener('click',()=>{drag=null;picker.showModal();positionPicker();glacierToggle.setAttribute('aria-expanded','true');revealHud();picker.querySelector('[aria-pressed="true"]').focus()});
picker.addEventListener('click',e=>{const button=e.target.closest('[data-glacier]');if(button){picker.close();if(button.dataset.glacier!==glacier?.id)location.hash=button.dataset.glacier;return}const r=picker.getBoundingClientRect();if(e.target===picker&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))picker.close()});
picker.addEventListener('close',()=>{glacierToggle.setAttribute('aria-expanded','false');recenter();glacierToggle.focus();revealHud(2800)});
reset.addEventListener('focus',()=>revealHud(2400));
function levelPhone(pose=latestPitch){if(!ready)return;leaveComparison();show(5);baseline=Number.isFinite(pose)?pose:null;center=5;filtered=0;calibrateRoll();revealHud(2800)}
reset.addEventListener('click',()=>levelPhone());
image.addEventListener('load',updateMapKey);
